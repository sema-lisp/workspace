# Workspace-local Rust build policy for the sema-lisp meta-repo.
#
# Cargo discovers config by walking UP from the build cwd, so this file applies
# to every member and every worktree under /Users/helge/code/sema — but NOT to
# ~/.cargo, unrelated projects elsewhere, or the mono's cargo-dist release/CI
# builds (those run in separate checkouts outside this tree). Member configs
# (e.g. sema/.cargo/config.toml) merge on top and win on any key conflict.
#
# Policy history: incremental was disabled 2026-07-10..2026-07-17 in favor of a
# shared sccache wrapper after an ENOSPC outage. The 2026-07-17 build-time
# investigation (sema/docs/build-time-report.md) measured that sccache gives the
# edit→compile loop nothing (edited crates and all their dependents are
# guaranteed cache misses) while incremental makes real-edit rebuilds ~2.2x
# faster, and the actual ENOSPC driver was per-worktree integration-test
# binaries (~100MB each), not incremental caches (~1.3G/worktree). So:
#
# - Incremental is ON (cargo's default) for fast edit loops.
# - The sccache wrapper is OFF: sccache hard-fails on `-C incremental` builds,
#   so the two are mutually exclusive. For a one-off cached clean build (e.g.
#   CI-style bootstrap) run with:
#     CARGO_INCREMENTAL=0 RUSTC_WRAPPER=sccache SCCACHE_DIR=/Users/helge/code/sema/.sccache cargo build
#
# Disk discipline REMAINS mandatory (cargo never GCs superseded artifacts):
# run `jake sweep [days=1]` when finishing worktrees or under disk pressure,
# and remove worktrees only via `jake wt-rm` (it cargo-cleans first).
